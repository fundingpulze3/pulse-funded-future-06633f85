# Render Blueprint — Blog Engine.
# New -> Blueprint -> connect this repo. Set the three values below and deploy.
services:
  - type: web
    name: blog-engine
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ANTHROPIC_API_KEY      # your Claude key
        sync: false
      - key: BLOG_ADMIN_EMAIL       # the admin login you use on the site
        sync: false
      - key: BLOG_ADMIN_PASSWORD    # that admin's password
        sync: false
      - key: SLOTS
        value: "09:00,14:00,19:00"
      - key: BLOG_ENGINE_DAILY_CAP
        value: "10"
      - key: BLOG_ENGINE_DAILY_USD_CAP
        value: "0.60"
      - key: BLOG_ENGINE_PER_BLOG_USD_CAP
        value: "0.15"
